<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandTrack Pro Master Edition - ELO HUD</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    :root {
      /* Nueva paleta ELO: Verde tecnológico y Gris */
      --bg-color: #020502; 
      --panel-color: rgba(12, 20, 12, 0.85); 
      --accent-main: #8BC34A; /* Verde ELO */
      --accent-secondary: #9E9E9E; /* Gris ELO */
      --text-main: #f1f8e9; 
      --bar-empty: #1b2614; 
      --danger-red: #ff1744;
      --glass-border: rgba(139, 195, 74, 0.2);
    }
    body { 
      font-family: 'Rajdhani', sans-serif; background-color: var(--bg-color); 
      background-image: radial-gradient(circle at 50% 50%, rgba(139, 195, 74, 0.05) 0%, transparent 60%), linear-gradient(rgba(139, 195, 74, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 195, 74, 0.03) 1px, transparent 1px); 
      background-size: 100% 100%, 40px 40px, 40px 40px; color: var(--text-main); margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; overflow: hidden; backdrop-filter: blur(5px);
    }
    
    h1, h3, h4 { margin: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    h1 { color: var(--accent-main); text-shadow: 0 0 15px rgba(139, 195, 74, 0.6); font-size: 24px; }
    h3 { color: var(--accent-main); font-size: 15px; margin-bottom: 10px; }
    h4 { color: #a3b894; font-size: 12px; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace; }
    hr { border: 0; border-top: 1px solid var(--glass-border); margin: 15px
