<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Contador Agrícola PRO — Limones</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
:root{--bg:#000;--panel:#111;--line:#2a2a2a;--text:#fff;--dim:#9a9a9a;--accent:#39ff6a;--danger:#ff4b4b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,Roboto,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px}h1{font-size:22px;font-weight:800;margin:0 0 4px}.subtitle{color:var(--dim);font-size:13px;margin-bottom:20px}.add-row{display:flex;gap:8px;margin-bottom:20px}.add-row input{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:16px}.btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}.btn-accent{background:var(--accent);color:#000;padding:14px 18px}.btn-block{width:100%;padding:18px;font-size:17px}.btn-outline{background:transparent;border:2px solid var(--line);color:var(--text);padding:12px}.btn-danger{background:var(--danger);color:#fff}.species-card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer}.species-card .sp-name{font-size:19px;font-weight:800;color:var(--accent)}.species-tree{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);margin-top:6px;padding-left:8px}.species-tree b{color:var(--text)}.empty{color:var(--dim);text-align:center;padding:30px 10px;border:2px dashed var(--line);border-radius:12px;font-size:14px}#view2{display:none}.back-btn{background:none;border:none;color:var(--text);font-size:16px;font-weight:700;margin-bottom:14px;cursor:pointer;padding:0}.cam-title{font-size:16px;color:var(--dim);margin-bottom:2px}.tree-label{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:12px}.cam-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#111;border:2px solid var(--line)}video{width:100%;display:block}#overlay{position:absolute;top:0;left:0;width:100%;height:100%}.live-count-container{display:flex;align-items:center;justify-content:center;margin:18px 0;position:relative}.live-count{text-align:center}.live-count .num{font-size:88px;font-weight:900;line-height:1;color:var(--accent)}.live-count .lbl{font-size:14px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}.reset-btn{position:absolute;right:4px;background:var(--panel);border:2px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold}.status{text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px;min-height:32px;line-height:1.4}.status.error{color:var(--danger);font-weight:700}.status.success{color:var(--accent);font-weight:700}.sens-box{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}.sens-label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:8px}.sens-label b{color:var(--accent);font-size:14px}.sens-box input[type=range]{width:100%;accent-color:var(--accent);height:26px}.modal-overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal-overlay.show{display:flex}.modal-box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}.modal-box p{font-size:15px;margin-bottom:18px}.modal-actions{display:flex;gap:10px}.modal-actions .btn{flex:1;padding:13px}
</style>
</head><body>
<div id="view1" class="wrap"><h1>🌱 Contador Agrícola PRO</h1><div class="subtitle">Modelo YOLO personalizado en ONNX · inferencia en el navegador</div><div class="add-row"><input type="text" id="inputNuevaEspecie" placeholder="Nueva especie (ej: Limones)" maxlength="80"><button class="btn btn-accent" id="btnAgregarEspecie">Añadir</button></div><div id="listaEspecies"></div><button class="btn btn-outline btn-block" id="btnBorrarTodo" style="margin-top:24px;color:var(--danger);border-color:var(--danger)">⚠️ Borrar toda la memoria</button></div>
<div id="view2" class="wrap"><button class="back-btn" id="btnVolver">← Volver</button><div class="cam-title" id="camEspecieLabel">Especie</div><div class="tree-label" id="camArbolLabel">Árbol 1</div><div class="cam-wrap"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div><div class="status" id="statusMsg">Cargando modelo neuronal…</div><div class="sens-box"><div class="sens-label"><span>Certeza mínima</span><b id="umbralTexto">50%</b></div><input type="range" id="sliderUmbral" min="0.1" max="1.0" step="0.01" value="0.5"></div><div class="live-count-container"><div class="live-count"><div class="num" id="liveCountNum">0</div><div class="lbl">frutos acumulados</div></div><button class="reset-btn" id="btnResetConteo">🔄 Reiniciar<br>paneo</button></div><button class="btn btn-accent btn-block" id="btnGuardarSiguiente" disabled>💾 Guardar y siguiente árbol</button></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box"><p id="modalText">¿Confirmar?</p><div class="modal-actions"><button class="btn btn-outline" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="modalConfirm">Confirmar</button></div></div></div>
<script>
'use strict';
// Mantener best.onnx junto a este archivo o actualizar esta ruta.
const MODEL_URL='./best.onnx', STORAGE_KEY='registrosAgricolasONNX';
function cargarMemoria(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return {};}}
function guardarMemoria(mem){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(mem));}catch(e){console.error('No se pudo guardar memoria local',e);}}
let memoria=cargarMemoria(),especieActual=null,arbolActualNum=1,umbralActual=.5;
const view1=document.getElementById('view1'),view2=document.getElementById('view2'),listaEspecies=document.getElementById('listaEspecies'),inputNuevaEspecie=document.getElementById('inputNuevaEspecie');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderDashboard(){const names=Object.keys(memoria);if(!names.length){listaEspecies.innerHTML='<div class="empty">Todavía no hay especies registradas</div>';return;}listaEspecies.innerHTML='';for(const especie of names){const arboles=memoria[especie]||{},nums=Object.keys(arboles),total=nums.reduce((s,a)=>s+(Number(arboles[a])||0),0),card=document.createElement('div');card.className='species-card';card.innerHTML=`<div class="sp-name">🌿 ${escapeHtml(especie)}</div><div class="species-tree"><span>${nums.length} árbol(es)</span><b>${total} frutos</b></div>`;card.addEventListener('click',()=>entrarACamara(especie));listaEspecies.appendChild(card);}}
document.getElementById('btnAgregarEspecie').addEventListener('click',()=>{const name=inputNuevaEspecie.value.trim();if(!name)return;if(!memoria[name])memoria[name]={};guardarMemoria(memoria);inputNuevaEspecie.value='';renderDashboard();});inputNuevaEspecie.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btnAgregarEspecie').click();});
const modalOverlay=document.getElementById('modalOverlay'),modalText=document.getElementById('modalText');let modalCallback=null;function showModal(text,onConfirm){modalText.textContent=text;modalCallback=onConfirm;modalOverlay.classList.add('show');}document.getElementById('modalCancel').addEventListener('click',()=>{modalOverlay.classList.remove('show');modalCallback=null;});document.getElementById('modalConfirm').addEventListener('click',()=>{modalOverlay.classList.remove('show');if(modalCallback)modalCallback();modalCallback=null;});document.getElementById('btnBorrarTodo').addEventListener('click',()=>showModal('¿Borrar TODA la memoria local de este navegador?',()=>{memoria={};guardarMemoria(memoria);renderDashboard();}));
const video=document.getElementById('video'),overlay=document.getElementById('overlay'),octx=overlay.getContext('2d'),statusMsg=document.getElementById('statusMsg'),liveCountNum=document.getElementById('liveCountNum'),btnGuardarSiguiente=document.getElementById('btnGuardarSiguiente'),camEspecieLabel=document.getElementById('camEspecieLabel'),camArbolLabel=document.getElementById('camArbolLabel'),sliderUmbral=document.getElementById('sliderUmbral'),umbralTexto=document.getElementById('umbralTexto');
let session=null,cameraStream=null,loopActivo=false,isProcessing=false,globalCount=0,nextTrackId=1,activeTracks=[];const INPUT_DIM=640,MAX_DISTANCE=.2,MAX_MISSED=8,canvas640=document.createElement('canvas');canvas640.width=INPUT_DIM;canvas640.height=INPUT_DIM;const ctx640=canvas640.getContext('2d',{willReadFrequently:true});
sliderUmbral.addEventListener('input',()=>{umbralActual=Number.parseFloat(sliderUmbral.value);umbralTexto.textContent=Math.round(umbralActual*100)+'%';});document.getElementById('btnResetConteo').addEventListener('click',resetearTracker);
function resetearTracker(){globalCount=0;nextTrackId=1;activeTracks=[];liveCountNum.textContent='0';octx.clearRect(0,0,overlay.width,overlay.height);}
async function entrarACamara(especie){especieActual=especie;const arboles=memoria[especie]||{};arbolActualNum=Object.keys(arboles).length+1;camEspecieLabel.textContent=especieActual;camArbolLabel.textContent=`Árbol ${arbolActualNum}`;resetearTracker();btnGuardarSiguiente.disabled=true;statusMsg.className='status';statusMsg.textContent='Iniciando cámara y modelo…';view1.style.display='none';view2.style.display='block';await iniciarCamara();if(cameraStream)await iniciarModelo();if(cameraStream&&session){btnGuardarSiguiente.disabled=false;statusMsg.className='status success';statusMsg.textContent='Modelo listo. ¡Detectando!';if(!loopActivo){loopActivo=true;requestAnimationFrame(loopDeteccion);}}}
async function iniciarCamara(){if(cameraStream)return;try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:640}}});video.srcObject=cameraStream;await new Promise((resolve,reject)=>{video.onloadedmetadata=()=>video.play().then(resolve).catch(reject);video.onerror=()=>reject(new Error('No se pudo iniciar vídeo'));});overlay.width=video.videoWidth;overlay.height=video.videoHeight;}catch(err){if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;statusMsg.className='status error';statusMsg.textContent='Error de cámara: concede permiso al sitio y utiliza HTTPS o localhost.';console.error(err);}}
async function iniciarModelo(){if(session)return;try{ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';session=await ort.InferenceSession.create(MODEL_URL,{executionProviders:['wasm']});}catch(err){statusMsg.className='status error';statusMsg.textContent='Error cargando best.onnx. Comprueba que el modelo esté junto al HTML y que su formato coincida con el código.';console.error(err);}}
async function loopDeteccion(){if(!loopActivo)return;requestAnimationFrame(loopDeteccion);if(isProcessing||!session||video.readyState<2)return;isProcessing=true;try{ctx640.drawImage(video,0,0,INPUT_DIM,INPUT_DIM);const imgData=ctx640.getImageData(0,0,INPUT_DIM,INPUT_DIM).data,float32Data=new Float32Array(3*INPUT_DIM*INPUT_DIM);for(let i=0,j=0;i<imgData.length;i+=4,j++){float32Data[j]=imgData[i]/255;float32Data[INPUT_DIM*INPUT_DIM+j]=imgData[i+1]/255;float32Data[2*INPUT_DIM*INPUT_DIM+j]=imgData[i+2]/255;}const tensor=new ort.Tensor('float32',float32Data,[1,3,INPUT_DIM,INPUT_DIM]);const results=await session.run({images:tensor}),output=results[Object.keys(results)[0]].data;const NUM_CAJAS=8400;let candidates=[];for(let i=0;i<Math.min(NUM_CAJAS,output.length/5);i++){const conf=output[4*NUM_CAJAS+i];if(conf>=umbralActual){const cx=output[i],cy=output[NUM_CAJAS+i],w=output[2*NUM_CAJAS+i],h=output[3*NUM_CAJAS+i];candidates.push({x:cx-w/2,y:cy-h/2,w,h,cx,cy,conf});}}candidates.sort((a,b)=>b.conf-a.conf);let finalBoxes=[];while(candidates.length){const best=candidates.shift();finalBoxes.push(best);candidates=candidates.filter(box=>calcularIoU(best,box)<.45);}procesarTracks(finalBoxes);dibujarBoundingBoxes();}catch(err){console.error('Error procesando frame:',err);statusMsg.className='status error';statusMsg.textContent='Error procesando imagen. Revisa el formato de salida de best.onnx.';}finally{isProcessing=false;}}
function procesarTracks(detections){const centroids=detections.map(d=>({x:d.cx/INPUT_DIM,y:d.cy/INPUT_DIM,box:d,score:d.conf})),matched=new Set();for(const track of activeTracks){let bestDist=MAX_DISTANCE,bestIdx=-1;for(let j=0;j<centroids.length;j++){if(matched.has(j))continue;const dist=Math.hypot(track.x-centroids[j].x,track.y-centroids[j].y);if(dist<bestDist){bestDist=dist;bestIdx=j;}}if(bestIdx!==-1){const det=centroids[bestIdx];Object.assign(track,{x:det.x,y:det.y,box:det.box,score:det.score,missed:0});matched.add(bestIdx);}else track.missed++;}activeTracks=activeTracks.filter(t=>t.missed<MAX_MISSED);for(let j=0;j<centroids.length;j++)if(!matched.has(j)){const d=centroids[j];activeTracks.push({id:nextTrackId++,x:d.x,y:d.y,box:d.box,score:d.score,missed:0});globalCount++;liveCountNum.textContent=String(globalCount);}}
function calcularIoU(a,b){const xA=Math.max(a.x,b.x),yA=Math.max(a.y,b.y),xB=Math.min(a.x+a.w,b.x+b.w),yB=Math.min(a.y+a.h,b.y+b.h),area=Math.max(0,xB-xA)*Math.max(0,yB-yA),areaA=a.w*a.h,areaB=b.w*b.h;const union=areaA+areaB-area;return union>0?area/union:0;}
function dibujarBoundingBoxes(){octx.clearRect(0,0,overlay.width,overlay.height);octx.lineWidth=3;octx.font='bold 16px sans-serif';const sx=overlay.width/INPUT_DIM,sy=overlay.height/INPUT_DIM;for(const t of activeTracks){if(t.missed>0)continue;const x=t.box.x*sx,y=t.box.y*sy,w=t.box.w*sx,h=t.box.h*sy;octx.strokeStyle='#39ff6a';octx.strokeRect(x,y,w,h);const label=`#${t.id} ${Math.round(t.score*100)}%`,tw=octx.measureText(label).width;octx.fillStyle='#39ff6a';octx.fillRect(x,y-20,tw+8,20);octx.fillStyle='#000';octx.fillText(label,x+4,y-5);}}
btnGuardarSiguiente.addEventListener('click',()=>{if(!especieActual)return;memoria[especieActual][`Árbol ${arbolActualNum}`]=globalCount;guardarMemoria(memoria);arbolActualNum++;camArbolLabel.textContent=`Árbol ${arbolActualNum}`;resetearTracker();});document.getElementById('btnVolver').addEventListener('click',()=>{loopActivo=false;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}video.srcObject=null;octx.clearRect(0,0,overlay.width,overlay.height);view2.style.display='none';view1.style.display='block';renderDashboard();});
renderDashboard();
</script></body></html>
