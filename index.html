<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kong.3D - Calculadora Pro</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --surface-color: #1c1c21;
            --primary-color: #007aff;
            --accent-color: #ff9500;
            --success-color: #34c759;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border-radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header span {
            color: var(--primary-color);
        }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: var(--surface-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .tab.active {
            background-color: var(--primary-color);
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Form */
        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .input-group {
            margin-bottom: 18px;
        }
        
        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .time-group {
            display: flex;
            gap: 12px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #2c2c2e;
            color: white;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255,149,0,0.15) 0%, rgba(255,149,0,0.05) 100%);
            border: 1px solid rgba(255,149,0,0.3);
            border-radius: 12px;
            margin-bottom: 22px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 22px;
            height: 22px;
            margin-right: 14px;
            accent-color: var(--accent-color);
        }

        .checkbox-group label {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-save { background-color: var(--success-color); }

        /* Results */
        .results-container {
            display: none;
            margin-top: 20px;
            border-left: 4px solid var(--primary-color);
        }
        
        .results-container.visible { display: block; }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #333;
        }

        .result-row:last-child { border-bottom: none; }

        .price-main {
            font-size: 24px;
            font-weight: 800;
            color: var(--success-color);
        }
        
        .price-sub {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .ganancia-tag {
            background-color: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .divider {
            height: 1px;
            background-color: #333;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>KONG<span>.3D</span> CALC</h1>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('calc')">Calculadora</div>
        <div class="tab" onclick="switchTab('config')">Configuración</div>
    </div>

    <!-- SECCIÓN CALCULADORA -->
    <div id="calc-section" class="section active card">
        <div class="input-group">
            <label>Tiempo de Impresión (Slicer)</label>
            <div class="time-group">
                <input type="number" id="h_impresion" inputmode="numeric" placeholder="Horas">
                <input type="number" id="m_impresion" inputmode="numeric" placeholder="Minutos">
            </div>
        </div>
        
        <div class="input-group">
            <label>Gramos Totales (Pieza + Purga del Slicer)</label>
            <input type="number" id="peso" inputmode="decimal" step="0.1" placeholder="Ej: 150">
        </div>
        
        <div class="input-group">
            <label>Post-Procesado / Diseño (Horas)</label>
            <input type="number" id="h_post" inputmode="decimal" step="0.1" placeholder="Tu tiempo activo">
        </div>
        
        <div class="input-group">
            <label>Colores Pintados / Extras</label>
            <input type="number" id="colores" inputmode="numeric" placeholder="Cantidad">
        </div>

        <div class="checkbox-group" onclick="toggleExpress()">
            <input type="checkbox" id="express" onclick="event.stopPropagation()">
            <label for="express">🚀 PRIORIDAD EXPRESS (+Recargo)</label>
        </div>

        <button id="btn-calcular" onclick="calcular()">CALCULAR PRESUPUESTO</button>

        <div id="results" class="results-container card" style="background-color: #16161a;">
            <div class="result-row">
                <span class="label">Total Inversión (Costos)</span>
                <span id="res_costo">$0</span>
            </div>
            <div class="divider"></div>
            <div class="result-row" style="flex-direction: column; align-items: center; gap: 5px;">
                <span style="font-size: 13px; color: var(--text-muted);">PRECIO EFECTIVO / TRANSFERENCIA</span>
                <span id="res_efectivo" class="price-main">$0</span>
            </div>
            <div class="result-row" style="flex-direction: column; align-items: center; gap: 5px;">
                <span style="font-size: 13px; color: var(--text-muted);">PRECIO TARJETA</span>
                <span id="res_tarjeta" class="price-sub">$0</span>
            </div>
            <div class="divider"></div>
            <div class="result-row">
                <span class="label">Empresa (Reinversión 65%) <span class="ganancia-tag">PRO</span></span>
                <span id="res_empresa" style="color: #ff9f0a; font-weight: 700;">$0</span>
            </div>
            <div class="result-row">
                <span class="label">Sueldo Personal (35%)</span>
                <span id="res_personal" style="color: #ff9f0a; font-weight: 700;">$0</span>
            </div>
        </div>
    </div>

    <!-- SECCIÓN CONFIGURACIÓN -->
    <div id="config-section" class="section card">
        <h3 style="margin-bottom: 15px; font-size: 16px;">Parámetros de Negocio</h3>
        
        <div class="input-group">
            <label>Costo de Preparación (Set-up Fee CLP)</label>
            <input type="number" id="cfg_setup" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Costo Luz por Hora (CLP)</label>
            <input type="number" id="cfg_luz" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Costo Filamento por Gramo (CLP)</label>
            <input type="number" id="cfg_fila" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Amortización Máquina por Hora (CLP)</label>
            <input type="number" id="cfg_maq" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Insumos Fijos (Caja/Laca/Alcohol)</label>
            <input type="number" id="cfg_insumos" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Valor Hora Tuya (Mano de Obra)</label>
            <input type="number" id="cfg_mano" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Factor de Error (Ej: 1.15)</label>
            <input type="number" id="cfg_error" inputmode="decimal" step="0.01">
        </div>
        <div class="input-group">
            <label>Margen Ganancia (Ej: 0.55)</label>
            <input type="number" id="cfg_margen" inputmode="decimal" step="0.01">
        </div>
        <div class="input-group">
            <label>Recargo Tarjeta (Ej: 1.25)</label>
            <input type="number" id="cfg_tarjeta" inputmode="decimal" step="0.01">
        </div>
        <div class="input-group">
            <label>Recargo Prioridad (Ej: 1.50)</label>
            <input type="number" id="cfg_express" inputmode="decimal" step="0.01">
        </div>

        <button class="btn-save" onclick="guardarConfig()">GUARDAR PARÁMETROS</button>
    </div>

    <script>
        const DEFAULT_CONFIG = {
            setup: 1500,
            luz: 28,
            fila: 20,
            maq: 300,
            insumos: 500,
            mano: 4000,
            pintura: 500,
            error: 1.15,
            margen: 0.55,
            tarjeta: 1.25,
            express: 1.50
        };

        const clp = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 });

        window.onload = () => {
            cargarConfig();
            setupNav();
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if(tab === 'calc') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('calc-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('config-section').classList.add('active');
            }
        }

        function cargarConfig() {
            const saved = JSON.parse(localStorage.getItem('kong3d_v2_cfg')) || DEFAULT_CONFIG;
            document.getElementById('cfg_setup').value = saved.setup;
            document.getElementById('cfg_luz').value = saved.luz;
            document.getElementById('cfg_fila').value = saved.fila;
            document.getElementById('cfg_maq').value = saved.maq;
            document.getElementById('cfg_insumos').value = saved.insumos;
            document.getElementById('cfg_mano').value = saved.mano;
            document.getElementById('cfg_error').value = saved.error;
            document.getElementById('cfg_margen').value = saved.margen;
            document.getElementById('cfg_tarjeta').value = saved.tarjeta;
            document.getElementById('cfg_express').value = saved.express;
            return saved;
        }

        function guardarConfig() {
            const cfg = {
                setup: parseFloat(document.getElementById('cfg_setup').value),
                luz: parseFloat(document.getElementById('cfg_luz').value),
                fila: parseFloat(document.getElementById('cfg_fila').value),
                maq: parseFloat(document.getElementById('cfg_maq').value),
                insumos: parseFloat(document.getElementById('cfg_insumos').value),
                mano: parseFloat(document.getElementById('cfg_mano').value),
                error: parseFloat(document.getElementById('cfg_error').value),
                margen: parseFloat(document.getElementById('cfg_margen').value),
                tarjeta: parseFloat(document.getElementById('cfg_tarjeta').value),
                express: parseFloat(document.getElementById('cfg_express').value)
            };
            localStorage.setItem('kong3d_v2_cfg', JSON.stringify(cfg));
            alert('Configuración guardada para Kong.3D');
            switchTab('calc');
        }

        function toggleExpress() {
            const cb = document.getElementById('express');
            cb.checked = !cb.checked;
        }

        function setupNav() {
            const inputs = Array.from(document.querySelectorAll('#calc-section input, #btn-calcular'));
            inputs.forEach((input, i) => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        if(input.id === 'btn-calcular') return calcular();
                        const next = inputs[i+1];
                        if(next) next.focus();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = inputs[i-1];
                        if(prev) prev.focus();
                    }
                });
            });
        }

        function calcular() {
            const cfg = cargarConfig();
            
            const h = parseFloat(document.getElementById('h_impresion').value) || 0;
            const m = parseFloat(document.getElementById('m_impresion').value) || 0;
            const h_total = h + (m/60);
            
            const peso = parseFloat(document.getElementById('peso').value) || 0;
            const h_post = parseFloat(document.getElementById('h_post').value) || 0;
            const colores = parseInt(document.getElementById('colores').value) || 0;
            const isExpress = document.getElementById('express').checked;

            if(h_total === 0 && peso === 0) return alert('Datos insuficientes');

            // Lógica Pro
            const costo_mat = peso * cfg.fila;
            const costo_luz = h_total * cfg.luz;
            const costo_maq = h_total * cfg.maq;
            
            // Inversión base ajustada por error
            const inversion_base = (costo_mat + costo_luz) * cfg.error;
            
            // Suma de fijos y mano de obra
            const inversion_total = inversion_base + costo_maq + (h_post * cfg.mano) + cfg.insumos + cfg.setup;

            let precio = inversion_total / (1 - cfg.margen);
            if(isExpress) precio *= cfg.express;

            const ganancia = precio - inversion_total;

            document.getElementById('res_costo').innerText = clp.format(inversion_total);
            document.getElementById('res_efectivo').innerText = clp.format(precio);
            document.getElementById('res_tarjeta').innerText = clp.format(precio * cfg.tarjeta);
            document.getElementById('res_empresa').innerText = clp.format(ganancia * 0.65);
            document.getElementById('res_personal').innerText = clp.format(ganancia * 0.35);

            document.getElementById('results').classList.add('visible');
            document.getElementById('results').scrollIntoView({behavior:'smooth'});
        }
    </script>
</body>
</html>
