<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandTrack Pro Master Edition - ELO USM HUD</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    :root {
      --bg-color: #020805;
      --panel-color: rgba(8, 20, 12, 0.88);
      --accent-cyan: #39d353;
      --accent-orange: #ff3366;
      --text-main: #d4f5dc;
      --bar-empty: #0a1f0e;
      --danger-red: #ff1744;
      --glass-border: rgba(57, 211, 83, 0.18);
    }
    body { 
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-color); 
      background-image:
        radial-gradient(circle at 50% 50%, rgba(57, 211, 83, 0.06) 0%, transparent 60%),
        linear-gradient(rgba(57, 211, 83, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 211, 83, 0.035) 1px, transparent 1px); 
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main); margin: 0; padding: 20px;
      display: flex; gap: 20px; height: 100vh;
      box-sizing: border-box; overflow: hidden;
    }
    
    h1, h3, h4 { margin: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    h1 { color: var(--accent-cyan); text-shadow: 0 0 15px rgba(57, 211, 83, 0.65); font-size: 24px; }
    h3 { color: var(--accent-cyan); font-size: 15px; margin-bottom: 10px; }
    h4 { color: #6aab78; font-size: 12px; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace; }
    hr { border: 0; border-top: 1px solid var(--glass-border); margin: 15px 0; }
    
    .panel {
      background-color: var(--panel-color);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85), inset 0 0 20px rgba(57,211,83,0.04);
      position: relative; padding: 15px; backdrop-filter: blur(10px);
      display: flex; flex-direction: column;
    }
    
    #video-panel { flex: 1; position: relative; }
    #camera-container {
      position: relative; flex: 1; background-color: #000;
      border-radius: 6px; border: 1px solid #0f2e14;
      overflow: hidden; transform: scaleX(-1);
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    
    #control-panel { width: 340px; overflow-y: auto; }
    #control-panel::-webkit-scrollbar { width: 5px; }
    #control-panel::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 5px; }
    
    button.main-btn {
      background: linear-gradient(90deg, rgba(57, 211, 83, 0.12), rgba(57, 211, 83, 0.06));
      border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
      padding: 12px; border-radius: 6px; font-weight: 700;
      font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
      letter-spacing: 2px; cursor: pointer; transition: 0.3s;
      margin-bottom: 10px; width: 100%; font-size: 15px;
    }
    button.main-btn:hover {
      background: rgba(57, 211, 83, 0.22);
      box-shadow: 0 0 20px rgba(57, 211, 83, 0.45);
    }
    
    button.pause-btn {
      display: none; background: rgba(255, 170, 0, 0.1); border: 1px solid #ffaa00;
      color: #ffaa00; padding: 10px; border-radius: 6px; font-weight: 700;
      font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; cursor: pointer;
      transition: 0.3s; margin-bottom: 10px; width: 100%; font-size: 13px;
    }
    button.pause-btn:hover { background: rgba(255, 170, 0, 0.2); box-shadow: 0 0 15px rgba(255, 170, 0, 0.4); }
    button.pause-btn.paused { background: rgba(255, 23, 68, 0.2); border-color: var(--danger-red); color: var(--danger-red); box-shadow: 0 0 15px rgba(255, 23, 68, 0.5); }
    
    button.sec-btn {
      background: transparent; border: 1px solid #1e4228; color: #5a8c65;
      padding: 8px; border-radius: 4px; font-family: 'Share Tech Mono', monospace;
      font-size: 11px; cursor: pointer; transition: 0.3s; width: 100%;
      margin-bottom: 10px; text-transform: uppercase;
    }
    button.sec-btn:hover { background: rgba(57, 211, 83, 0.1); color: #d4f5dc; border-color: var(--accent-cyan); }
    
    .status-text { font-family: 'Share Tech Mono', monospace; font-size: 13px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    
    .finger-telemetry { margin-bottom: 10px; }
    .finger-info { display: flex; justify-content: space-between; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #5a8c65; margin-bottom: 5px; }
    .bar-container { height: 10px; background-color: var(--bar-empty); border-radius: 3px; overflow: hidden; position: relative; border: 1px solid #0f2e14; }
    .bar-fill { height: 100%; width: 0%; background: #39d353; transition: width 0.1s, background 0.1s; box-shadow: 0 0 10px rgba(57, 211, 83, 0.55); }
    
    #calibration-wrapper { display: none; padding: 10px; background: rgba(0,0,0,0.35); border-radius: 6px; border: 1px solid #0f2e14; margin-top: 10px; }
    .calib-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace; font-size: 11px; }
    .calib-label { width: 60px; color: #d4f5dc; }
    .slider { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #0f2e14; outline: none; margin: 0 10px; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-cyan); cursor: pointer; box-shadow: 0 0 8px var(--accent-cyan); }
    .calib-val { width: 30px; text-align: right; color: var(--accent-orange); font-weight: bold; }
    
    .deco-line { position: absolute; background: var(--accent-cyan); opacity: 0.45; }
    .deco-h { width: 30px; height: 2px; top: -1px; left: 20px; }
    .deco-v { width: 2px; height: 30px; top: 20px; left: -1px; }

    /* ── Badge institucional ── */
    #inst-badge {
      position: absolute; top: 12px; right: 16px; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      background: rgba(4, 16, 8, 0.82);
      border: 1px solid rgba(57, 211, 83, 0.22);
      border-radius: 10px;
      padding: 8px 14px 8px 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(57, 211, 83, 0.07), inset 0 0 12px rgba(57,211,83,0.03);
      transition: box-shadow 0.3s;
    }
    #inst-badge:hover {
      box-shadow: 0 0 30px rgba(57, 211, 83, 0.18), inset 0 0 14px rgba(57,211,83,0.06);
    }
    /* Logo ELO: color natural con glow */
    #logo-elo {
      height: 40px; width: auto;
      filter: drop-shadow(0 0 5px rgba(57, 211, 83, 0.45));
      transition: filter 0.3s;
    }
    #logo-elo:hover { filter: drop-shadow(0 0 10px rgba(57, 211, 83, 0.85)) brightness(1.1); }

    .badge-sep {
      width: 1px; height: 34px;
      background: linear-gradient(to bottom, transparent, rgba(57,211,83,0.3), transparent);
      flex-shrink: 0;
    }
    /* Bloque de texto USM */
    .badge-usm {
      display: flex; flex-direction: column; gap: 2px;
    }
    .usm-top {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px; letter-spacing: 2px;
      color: rgba(57, 211, 83, 0.5);
      text-transform: uppercase;
      line-height: 1;
    }
    .usm-sigla {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px; font-weight: 700; letter-spacing: 3px;
      color: var(--accent-cyan);
      text-shadow: 0 0 14px rgba(57, 211, 83, 0.55);
      text-transform: uppercase;
      line-height: 1;
    }
    .usm-dept {
      font-family: 'Share Tech Mono', monospace;
      font-size: 7.5px; letter-spacing: 1px;
      color: rgba(57, 211, 83, 0.45);
      text-transform: uppercase;
      line-height: 1;
    }
  </style>
</head>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; max-width: 60%;">
      <h1>HANDTRACK // MASTER</h1>
    </div>
    <div id="camera-container">
      <video id="input_video" playsinline style="display:none"></video>
      <canvas id="output_canvas" width="640px" height="480px"></canvas>
    </div>
  </div>

  <div id="control-panel" class="panel">
    <button id="fullscreenBtn" class="sec-btn" onclick="toggleFullScreen()">⛶ PANTALLA COMPLETA</button>
    <button id="connectBtn" class="main-btn">🔌 INICIAR SECUENCIA (USB)</button>
    <button id="pauseBtn" class="pause-btn">⏸️ PAUSAR CÁMARA (STANDBY)</button>
    
    <div class="status-text">
      <span style="color:#3a5c42;">ENLACE DE DATOS:</span>
      <span id="serialStatus" style="color:var(--danger-red); font-weight:bold; text-shadow: 0 0 8px rgba(255, 23, 68, 0.5);">[ OFFLINE ]</span>
    </div>
    
    <hr>
    <h3>TELEMÉTRICA DE SERVOS</h3>
    <div id="bars"></div>

    <hr>
    <button id="toggleCalibBtn" class="sec-btn" onclick="toggleCalibracion()">⚙️ AJUSTES AVANZADOS ▼</button>
    
    <div id="calibration-wrapper">
      <h4>SENSIBILIDAD EN VIVO</h4>
      <div id="calibration-panel"></div>
    </div>
  </div>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } 
      else { if (document.exitFullscreen) { document.exitFullscreen(); } }
    }

    function toggleCalibracion() {
      const panel = document.getElementById('calibration-wrapper');
      const btn = document.getElementById('toggleCalibBtn');
      if (panel.style.display === 'none' || panel.style.display === '') {
        panel.style.display = 'block';
        btn.innerHTML = "⚙️ AJUSTES AVANZADOS ▲";
      } else {
        panel.style.display = 'none';
        btn.innerHTML = "⚙️ AJUSTES AVANZADOS ▼";
      }
    }

    let port, writer;
    let targetAngles = [0, 0, 0, 0, 0]; 
    let smoothedAngles = [0, 0, 0, 0, 0]; 
    let ultimaVezMano = Date.now();
    let camaraPausada = false;

    let sensibilidades = [40, 80, 55, 80, 80]; 
    const NOMBRES_DEDOS = ["PULGAR", "ÍNDICE", "MEDIO", "ANULAR", "MEÑIQUE"];

    const barsContainer = document.getElementById('bars');
    NOMBRES_DEDOS.forEach((nombre, i) => {
      barsContainer.innerHTML += `
        <div class="finger-telemetry">
          <div class="finger-info"><span style="color:#d4f5dc">${nombre}</span><span id="val-${i}">ABIERTO</span></div>
          <div class="bar-container"><div class="bar-fill" id="bar-${i}"></div></div>
        </div>`;
    });

    const calibContainer = document.getElementById('calibration-panel');
    NOMBRES_DEDOS.forEach((nombre, i) => {
      calibContainer.innerHTML += `
        <div class="calib-row">
          <span class="calib-label">${nombre.substring(0,3)}</span>
          <input type="range" min="20" max="120" value="${sensibilidades[i]}" class="slider" id="slider-${i}" oninput="updateSens(${i}, this.value)">
          <span class="calib-val" id="sval-${i}">${sensibilidades[i]}</span>
        </div>`;
    });

    function updateSens(index, value) {
      sensibilidades[index] = parseInt(value);
      document.getElementById(`sval-${index}`).innerText = value;
    }

    document.getElementById('connectBtn').onclick = async () => {
      try { 
        port = await navigator.serial.requestPort(); 
        await port.open({ baudRate: 9600 }); 
        await port.setSignals({ dataTerminalReady: true, requestToSend: true });
        writer = port.writable.getWriter(); 
        
        document.getElementById('connectBtn').style.display="none"; 
        document.getElementById('pauseBtn').style.display="block"; 
        
        document.getElementById('serialStatus').innerText="[ ONLINE / TX ]"; 
        document.getElementById('serialStatus').style.color="#39d353";
        document.getElementById('serialStatus').style.textShadow="0 0 10px rgba(57, 211, 83, 0.7)";
        
        camera.start();
      } catch (err) { alert("Error: " + err); }
    };

    document.getElementById('pauseBtn').onclick = () => {
      camaraPausada = !camaraPausada;
      const btn = document.getElementById('pauseBtn');
      if (camaraPausada) {
        btn.classList.add('paused');
        btn.innerHTML = "▶️ REANUDAR CÁMARA";
        targetAngles = [0, 0, 0, 0, 0]; 
      } else {
        btn.classList.remove('paused');
        btn.innerHTML = "⏸️ PAUSAR CÁMARA (STANDBY)";
      }
    };

    function vec3(p1, p2) { return { x: p2.x - p1.x, y: p2.y - p1.y, z: p2.z - p1.z }; }
    function mag(v) { return Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z); }
    function dot(v1, v2) { return v1.x*v2.x + v1.y*v2.y + v1.z*v2.z; }
    function getFingerAngle(A, B, C) {
      const vBA = vec3(B, A), vBC = vec3(B, C);
      return Math.acos(Math.max(-1, Math.min(1, dot(vBA, vBC) / (mag(vBA) * mag(vBC))))) * (180 / Math.PI);
    }

    setInterval(async () => {
      let comandoArduino = "";
      
      if (!camaraPausada && Date.now() - ultimaVezMano > 1500) { targetAngles = [0, 0, 0, 0, 0]; }
      
      for (let i = 0; i < 5; i++) {
        smoothedAngles[i] += (targetAngles[i] - smoothedAngles[i]) * 0.45; 

        let dedoCerrado = smoothedAngles[i] > 80;
        comandoArduino += dedoCerrado ? "0" : "1";
        
        const bar = document.getElementById(`bar-${i}`);
        let porcentajeVisual = Math.min(100, (smoothedAngles[i] / 180) * 100);
        
        document.getElementById(`val-${i}`).innerText = dedoCerrado ? "CERRADO" : "ABIERTO";
        bar.style.width = porcentajeVisual + "%";
        
        if (dedoCerrado) {
          bar.style.background = "var(--accent-orange)";
          bar.style.boxShadow = "0 0 10px rgba(255, 51, 102, 0.6)";
        } else {
          bar.style.background = "#39d353";
          bar.style.boxShadow = "0 0 10px rgba(57, 211, 83, 0.5)";
        }
      }
      
      if (writer) {
        const data = new TextEncoder().encode(comandoArduino + "\n");
        await writer.write(data);
      }
    }, 50); 

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.85, minTrackingConfidence: 0.40 });
    
    hands.onResults((results) => {
      const canvasCtx = document.getElementById('output_canvas').getContext('2d');
      canvasCtx.clearRect(0, 0, 640, 480);
      canvasCtx.drawImage(results.image, 0, 0, 640, 480);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        ultimaVezMano = Date.now();
        const h = results.multiHandLandmarks[0];
        
        let lineColor = camaraPausada ? 'rgba(255, 23, 68, 0.4)' : 'rgba(57, 211, 83, 0.65)';
        let pointColor = camaraPausada ? 'rgba(255, 23, 68, 0.8)' : '#ff3366';
        
        drawConnectors(canvasCtx, h, HAND_CONNECTIONS, {color: lineColor, lineWidth: 4});
        drawLandmarks(canvasCtx, h, {color: '#fff', fillColor: pointColor, lineWidth: 2, radius: 4});

        if (!camaraPausada) {
          const mapear = (nudilloA, baseB, tipC, sensibilidadIndex) => {
            let flex = getFingerAngle(h[nudilloA], h[baseB], h[tipC]);
            return Math.max(0, Math.min(180, (180 - flex) * (180 / sensibilidades[sensibilidadIndex]))); 
          };
          
          targetAngles[0] = mapear(0, 2, 4, 0); 
          targetAngles[1] = mapear(0, 5, 8, 1);
          targetAngles[2] = mapear(0, 9, 12, 2);
          targetAngles[3] = mapear(0, 13, 16, 3);
          targetAngles[4] = mapear(0, 17, 20, 4);
        }
      }
    });

    const camera = new Camera(document.getElementById('input_video'), { 
      onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); }, width: 640, height: 480 
    });
  </script>
</body>
